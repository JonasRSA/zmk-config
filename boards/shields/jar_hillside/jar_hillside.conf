# HillSideView 46 - gilt fuer BEIDE Haelften.

# P0.09 (C5) und P0.10 (C4) sind am nRF52840 ab Werk NFC-Antennenpins.
# Ohne diese Option lassen sie sich NICHT als GPIO/Matrixspalte nutzen.
CONFIG_NFCT_PINS_AS_GPIOS=y

# Das Display (nice!view) wird ueber das nice_view-Shield nur auf der linken
# Haelfte aktiviert (siehe build.yaml) - hier bewusst nichts weiter noetig.

# Optional: Deep-Sleep zum Stromsparen (weckt bei Tastendruck, wakeup-source ist gesetzt)
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
