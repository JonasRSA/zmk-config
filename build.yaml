# GitHub-Actions-Build-Matrix fuer HillSideView 46.
# RECHTE Haelfte = Central (+ ZMK Studio, spaeter Touchpad).
# LINKE Haelfte  = Peripheral (+ nice!view).
# ZMK Studio laeuft auf der Central -> Studio-Snippet gehoert an die rechte Haelfte
# (zum Studio-Nutzen USB in die RECHTE Haelfte stecken).
---
include:
  - board: nice_nano_v2
    shield: jar_hillside_right
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: jar_hillside_right
  - board: nice_nano_v2
    shield: jar_hillside_left nice_view
    artifact-name: jar_hillside_left
  # Optional: Settings-Reset-Firmware (bei Kopplungsproblemen auf jede Haelfte flashen)
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
